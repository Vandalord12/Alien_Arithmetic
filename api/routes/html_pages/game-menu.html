<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Arithmetic | Alien Approach</title>
  </head>
  <body>
    <style>
      body {
        /* Defaults the body tags*/
        margin: 0;
        padding: 0;
      }
      /* This box will harbor the game and game end stuff */
      .game-box {
        border: 1px solid black;
        width: 90vh;
        height: 90vh;
        margin-left: 50vw;
        margin-top: 5vh;
        transform: translateX(-50%);
      }

      a,
      p,
      h1,
      h2,
      h3 {
        /* Defaults these tags*/
        padding: 0;
        margin: 0;
      }
      #menu {
        margin: 0 auto;
        text-align: center;
      }
      #game-title {
        margin-top: 20vh;
      }
      #type {
        margin-bottom: 2.5vh;
      }
    </style>
    <div class="game-box" id="game-box">
      <div id="menu">
        <!-- The game title -->
        <h1 id="game-title">Alien Approach</h1>
        <br />
        <h3 id="type">Game Type:</h3>
        <form>
          <!-- radio buttons to choose the different game mode -->
          <input type="radio" id="md" name="type" value="md" />
          <label for="md">Multiplication and Division</label><br />
          <input type="radio" id="as" name="type" value="as" />
          <label for="as">Addition and Subtraction</label><br />
          <input type="radio" id="both" name="type" value="both" />
          <label for="both">Both</label>
        </form>
        <!-- button to start the game -->
        <button id="play">Start Game</button>
      </div>
    </div>
    <script>
      try {
        //This checks if the type is already selected from
        //a previous game. If yes, then it checked the corresponding
        //radio button.
        let type = sessionStorage.getItem("type");
        const input = document.getElementById(type);
        input.checked = true;
      } catch {
        //If the type is not selected, the Both radio button
        //is checked by default
        const input = document.getElementById("both");
        input.checked = true;
      }

      const startButton = document.querySelector("button");
      startButton.addEventListener("click", () => {
        //When the start button is clicked, store the type of radio button
        //selected and go to the game.
        const inputs = document.querySelectorAll("input");
        inputs.forEach((e) => {
          if (e.checked === true) {
            type = e.value;
            sessionStorage.setItem("type", type);
            location.href = "http://localhost:3000/games/game-one";
          }
        });
      });
    </script>
  </body>
</html>
