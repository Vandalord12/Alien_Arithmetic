<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Arithmetic | Login</title>
  </head>
  <body>
    <style>
      /* Imports a font family from google fonts */
      @import url("https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap");
      * {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Josefin Sans", serif;
      }

      .login-form {
        /* This styles the form tags */
        margin: 0 auto;
        margin-top: 18%;
        max-width: 400px;
      }
      .login-form #password,
      #email {
        /* This styles the form input fields  */
        display: block;
        width: 100%;
        margin: 5px 0;
        padding: 5px;
      }

      .login-form h2 {
        /* This styles the form title */
        margin-bottom: 30px;
      }

      button#login {
        /* This styles the 'Login' button */
        border: 0;
        background-color: orange;
        padding: 8px;
        font-weight: bold;
      }

      button#to-signup {
        /* This styles the 'Make an account' button */
        background-color: white;
        border: 0;
      }

      a {
        /* This styles the link tags */
        color: orange;
        text-decoration: none;
      }

      .buttons {
        /* This aligns the buttons to login and sign up */
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        width: 100%;
      }

      button:hover {
        /* When hovering over a button the 
        opacity decreases*/
        opacity: 0.75;
      }

      .landing-body {
        /* This div aligns the children divs to 
        be centerd on the y axis */
        display: flex;
        justify-content: center;
        height: 100%;
      }

      .title {
        /* This styles the logo */
        margin: 0 auto;
        text-align: center;
        background-color: rgb(50 216 223);
        color: white;
        width: 100%;
        height: 100%;
      }

      .description {
        margin-top: 46vh;
      }

      .login {
        width: 100%;
      }

      .error {
        /* This styles error messages */
        color: red;
      }
    </style>

    <div class="landing-body">
      <div class="title">
        <div class="description">
          <h1>Alien Arithmetic</h1>
          <!-- Logo and a short description -->
          <p>Fun games to practice basic arithemtic with aliens</p>
        </div>
      </div>
      <div class="login">
        <form class="login-form">
          <!-- the form tag that contains the input fields -->
          <h2>Log into to play!</h2>
          <label for="email">Email:</label><br />
          <input type="email" id="email" name="email" /><br />
          <p class="error" id="email-error"></p>
          <br />
          <label for="password">Password:</label><br />
          <input type="password" id="password" name="password" /><br />
          <!-- Show password button -->
          <input type="checkbox" onclick="showPassword()" id="show" />
          <label for="show">Show password</label>
          <br /><br />
          <p class="error" id="password-error"></p>
          <br />
        </form>
        <div class="buttons">
          <!-- button to login -->
          <button id="login" onclick="login()">Login</button>
          <!-- button to go to the sign up page -->
          <button id="to-signup">
            <a href="/register/basic">Make an account</a>
          </button>
        </div>
      </div>
    </div>
    <script>
      function showPassword() {
        //Function to toggle passsword visability
        const password = document.getElementById("password");
        if (password.type === "password") {
          password.type = "text";
        } else {
          password.type = "password";
        }
      }
      function getElement(id) {
        //Gets a inputs fields value from the DOM
        const ele = document.getElementById(id);
        return ele.value;
      }

      function cleanForm() {
        //Clears all the text from the error p tags
        const errorTags = document.querySelectorAll(".error");
        errorTags.forEach((ele) => {
          ele.textContent = "";
        });
      }

      function valiadateData(data) {
        //Takes in the validation message from the server
        //and displays the messages in the DOM
        const splitData = data.split(": ");
        const element = document.getElementById(splitData[0] + "-error");
        element.textContent = splitData[1];
      }

      function login() {
        //Sends a POST request to the server in order to login a user
        fetch("http://localhost:3000/login", {
          method: "POST",
          body: JSON.stringify({
            email: getElement("email"),
            password: getElement("password"),
          }),
          headers: {
            "Content-type": "application/json; charset=UTF-8",
          },
        })
          .then((res) => {
            return res.json();
          })
          .then((data) => {
            if (data.state) {
              location.href = "http://localhost:3000/home";
            } else {
              cleanForm();
              valiadateData(data.message);
            }
          })
          .catch((err) => {
            console.log(err.message);
          });
      }
    </script>
  </body>
</html>
