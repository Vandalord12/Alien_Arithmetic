<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Arithmetic | Alien Approach</title>
    <!-- connects to the css file on the server -->
    <link rel="stylesheet" href="http://localhost:3000/styles/game.css" />
  </head>
  <body>
    <!-- this div contains the game -->
    <div class="game-box" id="game-box">
      <div class="attributes">
        <!-- The score counter for the player -->
        <p>Score: <span id="score">0</span></p>
        <!-- The lives counter for the player -->
        <p>Lives: <span id="lives">3</span></p>
      </div>

      <input type="text" id="input" />
      <div id="main-char"></div>
    </div>
    <!-- These script tags connect to the js files that are hosted on
    the server -->
    <script
      src="http://localhost:3000/javascript/game.js"
      type="module"
    ></script>
    <script
      src="http://localhost:3000/javascript/enemies.js"
      type="module"
    ></script>
  </body>
</html>
