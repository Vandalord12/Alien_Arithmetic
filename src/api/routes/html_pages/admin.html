<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Arithmetic | Admin Page</title>
    <link rel="stylesheet" href="http://localhost:3000/styles/styles.css" />
  </head>
  <body>
    <style>
      html {
        /* Makes the background this colour*/
        background-color: rgb(50 216 223);
      }
      .main {
        /* The main container */
        margin: 2.5% auto;
        width: 90%;
        padding: 20px;
        border: 0;
        background-color: white;
        box-shadow: 3px 5px 10px rgb(92, 92, 92);
      }
      .user-record {
        /* Styles the user record */
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        width: 100%;
      }
      .user-records {
        /* Styles the box containing the user records */
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      .columns {
        /* Styles the box with the field names */
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 5px;
      }
      .record {
        /* Arranges the boxes of data for each record */
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 10px;
        border: 2px solid orange;
        padding: 5px;
      }

      .show-more {
        /* Makes the p tag seem like a button */
        cursor: pointer;
      }

      .scores h5 {
        width: fit-content;
      }

      span {
        margin-left: 10px;
      }

      .detail {
        margin-bottom: 10px;
      }
      .drop {
        display: none;
        position: absolute;
      }

      ol {
        /* Styles and overflow area and makes it invisible */
        background-color: white;
        color: black;
        text-align: center;
        width: fit-content;
      }
      li {
        /* Styles the scores displayed in the overflow list */
        margin: 0;
        padding: 0 10px;
        text-align: center;
      }
      .del-button {
        position: absolute;
        left: 90%;
        display: none;
      }
      .record:hover .del-button {
        /* Makes the delete button appear when 
        hovering over over a record */
        display: block;
      }

      .logout,
      .del-button button {
        /* Styles the del and log out buttons */
        border: 0;
        background-color: orange;
        padding: 5px;
        cursor: pointer;
      }
      .logout {
        margin-top: 5%;
      }
    </style>

    <div class="main">
      <h2>Users</h2>
      <div class="user-records">
        <div class="columns">
          <!-- Here are the field names for the user details -->
          <h4 style="width: 10%">ID</h4>
          <h4 style="width: 40%">Details</h4>
          <h4 style="width: 40%">Scores</h4>
          <h4 style="width: 10%">High-Scores</h4>
        </div>
        <!-- Over here is where the user records will go -->
      </div>
      <!-- Button to log out -->
      <button class="logout" onclick="logOut()">Log out</button>
    </div>
    <script src="http://localhost:3000/page_scripts/admin.js">
      
    </script>
  </body>
</html>
